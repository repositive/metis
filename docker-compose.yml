version: '2'
services:
  metis:
    command: /bin/sh -c "npm i && npm run make && npm run startDev"
    image: node:latest
    working_dir: /opt
    volumes:
      - .:/opt
    environment:
      TERM: dumb
      DB_URI: postgres://repositive:repositive@postgres:5432/metis
    depends_on:
      - postgres
    networks:
      - service
      - rabbit
      - db

networks:
  service:
  db:
  postgres:
    external:
      name: postgres
  rabbit:
    external:
      name: rabbit
